{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}Log in · MemoryBell{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-10rem)] grid place-items-center px-4 py-12">
    <div class="w-full max-w-sm">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-semibold">Welcome back</h1>
            <p class="mt-2 text-muted">Log in to see what’s coming up.</p>
        </div>

        <form method="POST" class="panel p-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div>
                <label class="label" for="email">Email</label>
                <div class="input-wrap">
                    {{ ui.icon('mail') }}
                    <input class="input has-icon" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" autofocus>
                </div>
            </div>
            <div>
                <label class="label" for="password">Password</label>
                <div class="input-wrap">
                    {{ ui.icon('lock') }}
                    <input class="input has-icon" type="password" id="password" name="password" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
        </form>

        <p class="mt-6 text-center text-sm text-muted">
            New to MemoryBell? <a href="/signup" class="font-medium text-accent hover:underline underline-offset-4">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
